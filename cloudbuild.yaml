# ─── Cloud Build CI/CD Pipeline (erix-store) ─────────────────────────────────
# Builds and deploys erix-store to Cloud Run.
#
# erix-store is an in-memory data structure server (like Redis) backed by
# PostgreSQL for persistence (WAL + snapshots). It needs:
#   - Always-on instance (min-instances: 1) to retain in-memory state
#   - Enough memory for the LRU cache (512 MB configured in code)
#   - Single instance (max-instances: 1) since it's a single-process store
# ──────────────────────────────────────────────────────────────────────────────

steps:
  # ─── Build ──────────────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest'
      - '.'

  # ─── Push ───────────────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push'
    args: ['push', '--all-tags', 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}']
    waitFor: ['build']

  # ─── Deploy to Cloud Run ────────────────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--timeout=300'
      - '--concurrency=80'
      - '--max-instances=1'
      - '--min-instances=1'
      - '--port=6399'
      - '--allow-unauthenticated'
      - '--no-cpu-throttling'
      - '--set-env-vars=NODE_ENV=production,PORT=6399'
    waitFor: ['push']

substitutions:
  _SERVICE_NAME: erix-store
  _REGION: us-central1

images:
  - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest'

options:
  logging: CLOUD_LOGGING_ONLY
